<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- #win：圆角/背景由它绘制（body 背景会传播到根画布顶掉圆角，参考托盘菜单 #menu 结构） -->
  <div id="win">
    <div id="titlebar">
      <span>样式</span>
      <button id="close" title="关闭">&#10005;</button>
    </div>
    <div id="form">
      <label class="row">
        <span class="name">正文字体</span>
        <div class="font-combo">
          <input id="font-body" type="text" placeholder="默认：思源宋体 CN" autocomplete="off" spellcheck="false" />
          <button class="font-toggle" type="button" tabindex="-1" title="选择字体">▾</button>
          <ul class="font-options" hidden></ul>
        </div>
      </label>
      <label class="row">
        <span class="name">界面字体</span>
        <div class="font-combo">
          <input id="font-ui" type="text" placeholder="默认：思源宋体 CN" autocomplete="off" spellcheck="false" />
          <button class="font-toggle" type="button" tabindex="-1" title="选择字体">▾</button>
          <ul class="font-options" hidden></ul>
        </div>
      </label>
      <label class="row">
        <span class="name">代码字体</span>
        <div class="font-combo">
          <input id="font-code" type="text" placeholder="默认：Consolas" autocomplete="off" spellcheck="false" />
          <button class="font-toggle" type="button" tabindex="-1" title="选择字体">▾</button>
          <ul class="font-options" hidden></ul>
        </div>
      </label>
      <label class="row">
        <span class="name">公式字体</span>
        <div class="font-combo">
          <input id="font-math" type="text" placeholder="默认：KaTeX_Main" autocomplete="off" spellcheck="false" />
          <button class="font-toggle" type="button" tabindex="-1" title="选择字体">▾</button>
          <ul class="font-options" hidden></ul>
        </div>
      </label>
      <label class="row">
        <span class="name">行间距</span>
        <input id="lineHeight" type="number" min="1" max="3" step="0.01" />
      </label>
      <label class="row">
        <span class="name">段落间距 (px)</span>
        <input id="paragraphSpacing" type="number" min="0" max="30" step="1" />
      </label>
      <label class="row">
        <span class="name">分割线粗细 (px)</span>
        <input id="dividerWidth" type="number" min="0" max="4" step="0.5" />
      </label>
      <div class="row">
        <span class="name">文字对齐</span>
        <div id="align-group">
          <label><input type="radio" name="align" value="justify" />两端对齐</label>
          <label><input type="radio" name="align" value="left" />靠左</label>
          <label><input type="radio" name="align" value="right" />靠右</label>
          <label><input type="radio" name="align" value="center" />居中</label>
        </div>
      </div>
      <div class="row">
        <span class="name">页面缩放</span>
        <div id="zoom-group">
          <button id="zoom-out" title="缩小 1%">&#8722;</button>
          <span id="zoom-label">100%</span>
          <button id="zoom-in" title="放大 1%">&#43;</button>
        </div>
      </div>
      <label class="row check">
        <input id="hideHelp" type="checkbox" />
        <span>屏蔽右下角帮助按钮</span>
      </label>
      <p id="hint"></p>
    </div>
  </div>
  <script src="font-detect.js"></script>
  <script src="settings.js"></script>
</body>
</html>
