<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="menu">
    <button class="item" data-action="open">
      <svg viewBox="0 0 16 16" width="15" height="15">
        <rect x="2.5" y="3.5" width="11" height="9" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M2.5 6h11" stroke="currentColor" stroke-width="1.3"/>
      </svg>
      <span>打开</span>
    </button>
    <button class="item" data-action="style">
      <svg viewBox="0 0 16 16" width="15" height="15">
        <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.8v1.8M8 12.4v1.8M1.8 8h1.8M12.4 8h1.8M3.6 3.6l1.3 1.3M11.1 11.1l1.3 1.3M12.4 3.6l-1.3 1.3M4.9 11.1l-1.3 1.3"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <span>样式</span>
    </button>
    <button class="item" data-action="settings">
      <svg viewBox="0 0 16 16" width="15" height="15">
        <circle cx="8" cy="8" r="4.3" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <circle cx="8" cy="8" r="1.8" fill="none" stroke="currentColor" stroke-width="1.3"/>
        <path d="M8 1.7v1.7M8 12.6v1.7M1.7 8h1.7M12.6 8h1.7M3.55 3.55l1.2 1.2M12.45 3.55l-1.2 1.2M3.55 12.45l1.2-1.2M12.45 12.45l-1.2-1.2"
              stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>设置</span>
    </button>
    <button class="item" data-action="quit">
      <svg viewBox="0 0 16 16" width="15" height="15">
        <path d="M8 2.2v4.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M4.9 4.1a5.1 5.1 0 1 0 6.2 0" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      <span>退出</span>
    </button>
  </div>
  <script src="menu.js"></script>
</body>
</html>
